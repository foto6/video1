name: CI

on:
  push:
    branches:
      - agent/creator-orchestrator
      - agent/creator-r11-autonomous-reels-20261001
      - agent/creator-r12-publish-providers-20261001
      - agent/creator-r13-integration-acceptance-20261001
      - agent/creator-r14-batch-campaign-20261001
      - agent/creator-r15-candidate-tournament-20261001
      - agent/creator-r16-media-r13-production-pin-20261001
      - agent/creator-r17-mvp-one-command-20261001
      - agent/creator-r18-semantic-director-20261001
      - agent/creator-r19-content-aware-mvp-20261001
      - agent/creator-r20-benchmark-export-20261001
      - agent/creator-r21-publish-execution-20261001
      - agent/creator-r22-autonomous-editor-loop-20261001
      - agent/creator-r23-editor-publish-handoff-20261001
      - agent/creator-r24-exact-pin-closed-loop-20261001
      - agent/creator-r26-real-review-closed-loop-20261002
      - agent/creator-r27-live-review-execution-20261002
  pull_request:

jobs:
  focused-r11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R11 autonomous reels tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_autonomous_reels_r11.py' -v

  focused-r12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R12 publish provider tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_publish_providers_r12.py' -v

  focused-r13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R13 integration acceptance tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_integration_acceptance_r13.py' -v

  focused-r14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R14 batch campaign tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_batch_campaign_r14.py' -v

  focused-r15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R15 tournament tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_candidate_tournament_r15.py' -v
      - name: Run deterministic four-candidate replay
        run: |
          work_dir="$(mktemp -d)"
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament replay --work-dir "$work_dir" > "$work_dir/report.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['technicalQaFailures']==1; assert r['guardrailFailures']==1; assert r['validCandidates']==2; assert r['winnerOrdinal']==3; assert r['mediaLogicalEffects']==4; assert r['mediaSubmitCalls']==4; assert r['productionReadinessClaim'] is False; assert r['mediaR13Readiness']['state']=='READY_MEDIA_R13'" "$work_dir/report.json"

  focused-r16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R16 Media R13 production-pin tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_media_r13_production_pin_r16.py' -v
      - name: Verify production Media readiness
        run: |
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament readiness > /tmp/r16-readiness.json
          python -c "import json; r=json.load(open('/tmp/r16-readiness.json')); assert r['state']=='READY_MEDIA_R13'; assert r['productionMediaReady'] is True; assert r['livePublishingEnabled'] is False"
      - name: Run real Media R13 cross-repo roundtrip
        run: |
          work_dir="$(mktemp -d)"
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament real-r13 --work-dir "$work_dir" > "$work_dir/report.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['state']=='REAL_MEDIA_R13_COMPATIBILITY_GREEN'; assert r['productionMediaReady'] is True; assert r['acceptedCandidate']['technicalQaPassed'] is True; assert r['acceptedCandidate']['creativeQualityPassed'] is True; assert r['tournamentAcceptance']['realCandidateCount']==1; assert r['tournamentAcceptance']['decisionState']=='insufficient_evidence'; assert r['tournamentAcceptance']['fakeRealRendersCreated']==0; assert r['livePublishingEnabled'] is False" "$work_dir/report.json"

  focused-r17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Creator MVP entrypoint
        run: python -m pip install -e .
      - name: Run Creator R17 MVP tests and real-video E2E
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          creator-mvp --help
          python -m unittest discover -s tests -p 'test_creator_mvp_r17.py' -v

  focused-r18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run Creator R18 semantic director tests
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_semantic_director_r18.py' -v

  focused-r18b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Creator entrypoints
        run: python -m pip install -e .
      - name: Run R18B fake-transport tests only
        env:
          GEMINI_API_KEY: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_gemini_video_provider_r18b.py' -v
      - name: Prove live smoke is blocked without credentials
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          set +e
          creator-gemini-video-smoke --input /tmp/not-present.mp4 > /tmp/gemini-smoke.json
          code=$?
          set -e
          test "$code" -eq 2
          python -c "import json; r=json.load(open('/tmp/gemini-smoke.json')); assert r['state']=='BLOCKED'; assert r['networkAttempted'] is False"

  focused-r19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R19 content-aware real-video E2E
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_content_aware_mvp_r19.py' -v

  focused-r20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R20 canonical semantic export tests
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_semantic_export_r20.py' -v

  focused-r21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R21 production-adapter fake transport and sandbox tests
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          creator-publish-sandbox --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_publish_execution_r21.py' -v

  focused-r22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Creator
        run: python -m pip install -e .
      - name: Run R22 bounded autonomous editor loop tests
        run: |
          creator-editor-loop-r22 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_autonomous_editor_loop_r22.py' -v
      - name: Run source-bound deterministic rehearsal
        run: |
          work_dir="$(mktemp -d)"
          creator-editor-loop-r22 --work-dir "$work_dir" > "$work_dir/stdout.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['terminalState']=='final_bundle'; assert r['terminalRoundIndex']==2; assert r['restartCount']==2; assert r['mediaAcceptedEffects']==8; assert r['mediaSubmitCalls']==8; assert r['criticAcceptedEffects']==8; assert r['criticSubmitCalls']==8; assert r['productionMediaRenderExportReady'] is False; assert r['humanLevelQualityClaimed'] is False" "$work_dir/stdout.json"

  focused-r23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R23 editor-to-publish handoff tests
        run: |
          creator-editor-publish-r23 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_editor_publish_handoff_r23.py' -v

  focused-r24-exact-pin:
    needs: full
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run R24 unit plus winner/resume exact-pin integration
        env:
          R24_MEDIA_CHECKOUT: ${{ github.workspace }}/.r24-media
          R24_GROWTH_CHECKOUT: ${{ github.workspace }}/.r24-growth
          R24_SOURCE_VIDEO: ${{ github.workspace }}/.r24-fixture/source.mp4
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 winner/resume render still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          # R24 unit tests already run in the exact same head's full job,
          # which this job needs. Avoid duplicating them before the expensive
          # real-render integration on a runner that has repeatedly shut down.
          PYTHONPATH=src:tests python -m unittest \
            test_exact_pin_closed_loop_r24.R24ClosedLoopIntegrationTests.test_exact_pin_real_artifact_winner_and_resume \
            -v
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

  focused-r24-exact-pin-nonwinner:
    needs: focused-r24-exact-pin
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test:
          - test_tie_never_prepares_publish
          - test_insufficient_evidence_never_prepares_publish
          - test_human_review_required_never_prepares_publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run exact-pin nonwinner scenario
        env:
          R24_MEDIA_CHECKOUT: ${{ github.workspace }}/.r24-media
          R24_GROWTH_CHECKOUT: ${{ github.workspace }}/.r24-growth
          R24_SOURCE_VIDEO: ${{ github.workspace }}/.r24-fixture/source.mp4
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 nonwinner render still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          PYTHONPATH=src:tests python -m unittest \
            "test_exact_pin_closed_loop_r24.R24ClosedLoopIntegrationTests.${{ matrix.test }}" \
            -v
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

  focused-r24-exact-pin-rehearsal:
    needs: focused-r24-exact-pin-nonwinner
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install -e .
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run reproducible real-artifact rehearsal
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 exact-pin rehearsal still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          creator-closed-loop-r24 --source .r24-fixture/source.mp4 --brief "Make the proof concise" --media-checkout .r24-media --growth-checkout .r24-growth --out .r24-rehearsal --candidates 2 > .r24-rehearsal.stdout.json
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          python -c "import json; r=json.load(open('.r24-rehearsal/closed_loop_rehearsal.v1.json')); assert r['state']=='publish_handoff_ready'; assert r['realMediaRenderEffects'] >= 1; assert r['reeditRounds'] <= 2; assert r['providerInvoked'] is False; assert r['liveProviderMutation'] is False"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json .r24-rehearsal/final.mp4 > .r24-rehearsal/final.ffprobe.json
      - name: Build Human Gate V4 real-artifact evidence manifest
        env:
          CREATOR_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".r24-rehearsal")
          report = json.loads((root / "closed_loop_rehearsal.v1.json").read_text())
          bundle = json.loads((root / "editor-final-bundle.json").read_text())
          ledger = root / "closed-loop-ledger.jsonl"
          final_mp4 = root / "final.mp4"

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          assert report["state"] == "publish_handoff_ready"
          assert report["reeditRounds"] <= 2
          assert report["providerInvoked"] is False
          assert report["liveProviderMutation"] is False
          assert final_mp4.stat().st_size > 0
          assert ledger.stat().st_size > 0
          assert sha256(final_mp4) == report["finalRenderSha256"]
          assert bundle["bundleDigest"] == report["finalBundleDigest"]
          assert bundle["winnerCandidateId"] == report["winnerCandidateId"]

          evidence = {
              "contractVersion": "creator.r24_human_gate_v4_artifact.v1",
              "creatorSha": os.environ["CREATOR_SHA"],
              "mediaProducerSha": "a17f782da8144d1e890ac83195396a3192df93c2",
              "growthProducerSha": "2d3bf275c5b456d53384073fb7ec1ed992e6b996",
              "source": report["source"],
              "winnerCandidateId": report["winnerCandidateId"],
              "finalRenderSha256": report["finalRenderSha256"],
              "finalMp4SizeBytes": final_mp4.stat().st_size,
              "finalBundleDigest": report["finalBundleDigest"],
              "growthDecisionDigest": report["growthDecisionDigest"],
              "publishHandoffDigest": report["publishHandoffDigest"],
              "ledgerDigest": report["ledgerDigest"],
              "ledgerFileSha256": sha256(ledger),
              "ledgerSizeBytes": ledger.stat().st_size,
              "reeditRounds": report["reeditRounds"],
              "candidateCount": report["candidateCount"],
              "realMediaRenderEffects": report["realMediaRenderEffects"],
              "renderProvenance": bundle["render"]["render_provenance"],
              "providerInvoked": False,
              "liveProviderMutation": False,
              "humanLevelQualityClaimed": False,
          }
          (root / "human-gate-v4-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Upload Human Gate V4 real-artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: creator-r24-human-gate-v4-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: |
            .r24-rehearsal/final.mp4
            .r24-rehearsal/editor-final-bundle.json
            .r24-rehearsal/editor-publish-handoff.json
            .r24-rehearsal/closed-loop-ledger.jsonl
            .r24-rehearsal/closed_loop_rehearsal.v1.json
            .r24-rehearsal/final.ffprobe.json
            .r24-rehearsal/human-gate-v4-evidence.json
            .r24-rehearsal/candidates/**/media.render_export.v1.json


  focused-r26:
    needs: full
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r26-media
      - name: Checkout exact Growth R23
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 26f769abceb43a63677ea8f7ba028369db371696
          path: .r26-growth
      - name: Install R26 runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install -e .
      - name: Run R26 strict review-boundary unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_real_review_closed_loop_r26.py' -v
      - name: Generate real Media source fixture
        run: |
          mkdir -p .r26-fixture
          ffmpeg -hide_banner -nostdin -y \
            -f lavfi -i "testsrc2=s=180x320:r=15:d=18" \
            -f lavfi -i "sine=frequency=523:sample_rate=48000:duration=18" \
            -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k .r26-fixture/source.mp4 >/dev/null 2>&1
      - name: Run R26 real Media restart/re-edit integration
        env:
          R26_MEDIA_CHECKOUT: ${{ github.workspace }}/.r26-media
          R26_GROWTH_R23_CHECKOUT: ${{ github.workspace }}/.r26-growth
          R26_SOURCE_VIDEO: ${{ github.workspace }}/.r26-fixture/source.mp4
        run: PYTHONPATH=src python integration_tests/r26_real_review_integration.py
      - name: Prove live-review gate remains blocked without external artifact
        run: |
          set +e
          creator-real-review-r26 readiness --out .r26-readiness.json > .r26-readiness.stdout.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          dynamic = json.load(open(".r26-readiness.json"))
          committed = json.load(open("reports/CREATOR_R26_REAL_REVIEW_READINESS.json"))
          assert dynamic["implementationStatus"] == "IMPLEMENTED"
          assert dynamic["realReviewExecutionStatus"] == "BLOCKED"
          assert dynamic["blocker"]["code"] == "MISSING_EXTERNAL_GROWTH_R23_REAL_REVIEW_EVENT"
          assert committed["implementationStatus"] == "IMPLEMENTED"
          assert committed["realReviewExecutionStatus"] == "BLOCKED"
          assert dynamic["growthProducer"]["sha"] == committed["growthProducerSha"]
          assert dynamic["mediaProducerSha"] == committed["mediaProducerSha"]
          assert dynamic["providerInvoked"] is False
          assert dynamic["credentialsUsed"] is False
          PY
      - name: Upload R26 readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: creator-r26-real-review-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .r26-readiness.json
            .r26-readiness.stdout.json
            reports/CREATOR_R26_REAL_REVIEW_READINESS.json

  focused-r27:
    needs: full
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact Media R19
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: 31409de4bef473417a33a8c698507f7cfb1905e1
          path: .r27-media
      - name: Checkout observed Growth R25 branch head
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: dc0741d5b11c1f7464ac9a6c5db80c0a4535df08
          path: .r27-growth
      - name: Install R27 runtime prerequisites
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v espeak-ng >/dev/null 2>&1 || missing+=(espeak-ng)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1
          python -m pip install -e .
      - name: Run R27 unit and exact Media R19 integration tests
        env:
          R27_MEDIA_R19_CHECKOUT: ${{ github.workspace }}/.r27-media
          R27_GROWTH_R25_CHECKOUT: ${{ github.workspace }}/.r27-growth
        run: |
          creator-live-review-r27 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_live_review_execution_r27.py' -v
      - name: Prove production gate remains blocked without genuine Growth R25 capture
        run: |
          set +e
          creator-live-review-r27 readiness --out .r27-readiness.json > .r27-readiness.stdout.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          r=json.load(open(".r27-readiness.json"))
          assert r["SOURCE_READY"] is True
          assert r["REAL_REVIEW_INGESTED"] is False
          assert r["REAL_REEDIT_EXECUTED"] is False
          assert r["PUBLISH_HANDOFF_READY"] is False
          assert r["state"] == "BLOCKED_WAITING_REAL_CAPTURE"
          assert r["mediaR19"]["sha"] == "31409de4bef473417a33a8c698507f7cfb1905e1"
          assert r["growthR25"]["observedSha"] == "dc0741d5b11c1f7464ac9a6c5db80c0a4535df08"
          assert r["safety"]["liveSocialProviderMutation"] is False
          PY
      - name: Upload R27 source-ready evidence
        uses: actions/upload-artifact@v4
        with:
          name: creator-r27-live-review-source-ready-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .r27-readiness.json
            .r27-readiness.stdout.json
            reports/CREATOR_R27_LIVE_REVIEW_READINESS.json
            conformance/creator.real_live_review_execution.r27.v1/**

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer for R17 E2E
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run full unit test suite
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -v
