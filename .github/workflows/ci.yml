          creator-autonomous-tournament-r32 chaos-rehearsal --out .r32-chaos > .r32-chaos.stdout.json
          creator-autonomous-tournament-r32 status --ledger .r32-chaos/autonomous-tournament-ledger.jsonl --out .r32-chaos/status-after-replay.json > .r32-chaos.status.stdout.json
          python - <<'PY'
          import json
          r=json.load(open(".r32-chaos/chaos-rehearsal.r32.json"))
          s=json.load(open(".r32-chaos/status-after-replay.json"))
          assert r["overallAuthorityStatus"] == "AUTONOMOUS_LOOP_SOURCE_READY"
          assert r["state"] == "PUBLISH_HANDOFF_READY"
          assert r["initialCandidateCount"] == 4
          assert r["independentReviewerCount"] == 3
          assert r["reviewRoundsCompleted"] == 2
          assert r["reeditRoundsExecuted"] == 1
          assert r["dispatchLogicalEffects"] == 6
          assert r["mediaReeditLogicalEffects"] == 1
          assert r["reconciliationEvents"] == 1
          assert r["lostAckConsensusBlocked"] is True
          assert r["browserMutation"] is False
          assert r["providerMutation"] is False
          assert r["livePublish"] is False
          assert r["humanGroundTruthClaimed"] is False
          assert s["state"] == "PUBLISH_HANDOFF_READY"
          assert s["nextPermittedAction"] == "STOP_NO_LIVE_PUBLISH"
          PY
      - name: Upload deterministic R32 evidence
        uses: actions/upload-artifact@v4
        with:
          name: creator-r32-autonomous-tournament-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: |
            .r32-readiness.json
            .r32-readiness.stdout.json
            .r32-status-source.json
            .r32-status-source.stdout.json
            .r32-chaos/**
            .r32-chaos.stdout.json
            .r32-chaos.status.stdout.json
            reports/CREATOR_R32_AUTONOMOUS_TOURNAMENT_READINESS.json
            conformance/creator.autonomous_tournament.r32.v1/**

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer for R17 E2E
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run full unit test suite
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -v
