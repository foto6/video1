          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R19 content-aware real-video E2E
        env:
          GEMINI_API_KEY: ""
