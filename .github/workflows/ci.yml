          python -m unittest discover -s tests -p 'test_semantic_export_r20.py' -v

  focused-r21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R21 production-adapter fake transport and sandbox tests
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          creator-publish-sandbox --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_publish_execution_r21.py' -v

  focused-r22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Creator
        run: python -m pip install -e .
      - name: Run R22 bounded autonomous editor loop tests
        run: |
          creator-editor-loop-r22 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_autonomous_editor_loop_r22.py' -v
      - name: Run source-bound deterministic rehearsal
        run: |
          work_dir="$(mktemp -d)"
          creator-editor-loop-r22 --work-dir "$work_dir" > "$work_dir/stdout.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['terminalState']=='final_bundle'; assert r['terminalRoundIndex']==2; assert r['restartCount']==2; assert r['mediaAcceptedEffects']==8; assert r['mediaSubmitCalls']==8; assert r['criticAcceptedEffects']==8; assert r['criticSubmitCalls']==8; assert r['productionMediaRenderExportReady'] is False; assert r['humanLevelQualityClaimed'] is False" "$work_dir/stdout.json"

  focused-r23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R23 editor-to-publish handoff tests
        run: |
          creator-editor-publish-r23 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_editor_publish_handoff_r23.py' -v

  focused-r24-exact-pin:
    needs: full
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run R24 unit plus winner/resume exact-pin integration
        env:
          R24_MEDIA_CHECKOUT: ${{ github.workspace }}/.r24-media
          R24_GROWTH_CHECKOUT: ${{ github.workspace }}/.r24-growth
          R24_SOURCE_VIDEO: ${{ github.workspace }}/.r24-fixture/source.mp4
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 winner/resume render still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          # R24 unit tests already run in the exact same head's full job,
          # which this job needs. Avoid duplicating them before the expensive
          # real-render integration on a runner that has repeatedly shut down.
          PYTHONPATH=src:tests python -m unittest \
            test_exact_pin_closed_loop_r24.R24ClosedLoopIntegrationTests.test_exact_pin_real_artifact_winner_and_resume \
            -v
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

  focused-r24-exact-pin-nonwinner:
    needs: focused-r24-exact-pin
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test:
          - test_tie_never_prepares_publish
          - test_insufficient_evidence_never_prepares_publish
          - test_human_review_required_never_prepares_publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run exact-pin nonwinner scenario
        env:
          R24_MEDIA_CHECKOUT: ${{ github.workspace }}/.r24-media
          R24_GROWTH_CHECKOUT: ${{ github.workspace }}/.r24-growth
          R24_SOURCE_VIDEO: ${{ github.workspace }}/.r24-fixture/source.mp4
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 nonwinner render still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          PYTHONPATH=src:tests python -m unittest \
            "test_exact_pin_closed_loop_r24.R24ClosedLoopIntegrationTests.${{ matrix.test }}" \
            -v
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

  focused-r24-exact-pin-rehearsal:
    needs: focused-r24-exact-pin-nonwinner
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Verify exact-pin runtime prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install -e .
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=0x224466:s=180x320:r=10:d=15" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run reproducible real-artifact rehearsal
        run: |
          heartbeat() {
            while sleep 10; do echo "R24 exact-pin rehearsal still active"; done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          creator-closed-loop-r24 --source .r24-fixture/source.mp4 --brief "Make the proof concise" --media-checkout .r24-media --growth-checkout .r24-growth --out .r24-rehearsal --candidates 2 > .r24-rehearsal.stdout.json
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          python -c "import json; r=json.load(open('.r24-rehearsal/closed_loop_rehearsal.v1.json')); assert r['state']=='publish_handoff_ready'; assert r['realMediaRenderEffects'] >= 1; assert r['reeditRounds'] <= 2; assert r['providerInvoked'] is False; assert r['liveProviderMutation'] is False"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json .r24-rehearsal/final.mp4 > .r24-rehearsal/final.ffprobe.json
      - name: Build Human Gate V4 real-artifact evidence manifest
        env:
          CREATOR_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".r24-rehearsal")
          report = json.loads((root / "closed_loop_rehearsal.v1.json").read_text())
          bundle = json.loads((root / "editor-final-bundle.json").read_text())
          ledger = root / "closed-loop-ledger.jsonl"
          final_mp4 = root / "final.mp4"

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          assert report["state"] == "publish_handoff_ready"
          assert report["reeditRounds"] <= 2
          assert report["providerInvoked"] is False
          assert report["liveProviderMutation"] is False
          assert final_mp4.stat().st_size > 0
          assert ledger.stat().st_size > 0
          assert sha256(final_mp4) == report["finalRenderSha256"]
          assert bundle["bundleDigest"] == report["finalBundleDigest"]
          assert bundle["winnerCandidateId"] == report["winnerCandidateId"]

          evidence = {
              "contractVersion": "creator.r24_human_gate_v4_artifact.v1",
              "creatorSha": os.environ["CREATOR_SHA"],
              "mediaProducerSha": "a17f782da8144d1e890ac83195396a3192df93c2",
              "growthProducerSha": "2d3bf275c5b456d53384073fb7ec1ed992e6b996",
              "source": report["source"],
              "winnerCandidateId": report["winnerCandidateId"],
              "finalRenderSha256": report["finalRenderSha256"],
              "finalMp4SizeBytes": final_mp4.stat().st_size,
              "finalBundleDigest": report["finalBundleDigest"],
              "growthDecisionDigest": report["growthDecisionDigest"],
              "publishHandoffDigest": report["publishHandoffDigest"],
              "ledgerDigest": report["ledgerDigest"],
              "ledgerFileSha256": sha256(ledger),
              "ledgerSizeBytes": ledger.stat().st_size,
              "reeditRounds": report["reeditRounds"],
              "candidateCount": report["candidateCount"],
              "realMediaRenderEffects": report["realMediaRenderEffects"],
              "renderProvenance": bundle["render"]["render_provenance"],
              "providerInvoked": False,
              "liveProviderMutation": False,
              "humanLevelQualityClaimed": False,
          }
          (root / "human-gate-v4-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Upload Human Gate V4 real-artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: creator-r24-human-gate-v4-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: |
            .r24-rehearsal/final.mp4
            .r24-rehearsal/editor-final-bundle.json
            .r24-rehearsal/editor-publish-handoff.json
            .r24-rehearsal/closed-loop-ledger.jsonl
            .r24-rehearsal/closed_loop_rehearsal.v1.json
            .r24-rehearsal/final.ffprobe.json
            .r24-rehearsal/human-gate-v4-evidence.json
            .r24-rehearsal/candidates/**/media.render_export.v1.json


  focused-r26:
    needs: full
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
