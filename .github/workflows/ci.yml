name: CI

on:
  push:
    branches:
      - agent/creator-orchestrator
      - agent/creator-r11-autonomous-reels-20261001
      - agent/creator-r12-publish-providers-20261001
      - agent/creator-r13-integration-acceptance-20261001
      - agent/creator-r14-batch-campaign-20261001
      - agent/creator-r15-candidate-tournament-20261001
      - agent/creator-r16-media-r13-production-pin-20261001
      - agent/creator-r17-mvp-one-command-20261001
      - agent/creator-r18-semantic-director-20261001
      - agent/creator-r19-content-aware-mvp-20261001
      - agent/creator-r20-benchmark-export-20261001
      - agent/creator-r21-publish-execution-20261001
      - agent/creator-r22-autonomous-editor-loop-20261001
      - agent/creator-r23-editor-publish-handoff-20261001
      - agent/creator-r24-exact-pin-closed-loop-20261001
  pull_request:

jobs:
  focused-r11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R11 autonomous reels tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_autonomous_reels_r11.py' -v

  focused-r12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R12 publish provider tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_publish_providers_r12.py' -v

  focused-r13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R13 integration acceptance tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_integration_acceptance_r13.py' -v

  focused-r14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R14 batch campaign tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_batch_campaign_r14.py' -v

  focused-r15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R15 tournament tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_candidate_tournament_r15.py' -v
      - name: Run deterministic four-candidate replay
        run: |
          work_dir="$(mktemp -d)"
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament replay --work-dir "$work_dir" > "$work_dir/report.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['technicalQaFailures']==1; assert r['guardrailFailures']==1; assert r['validCandidates']==2; assert r['winnerOrdinal']==3; assert r['mediaLogicalEffects']==4; assert r['mediaSubmitCalls']==4; assert r['productionReadinessClaim'] is False; assert r['mediaR13Readiness']['state']=='READY_MEDIA_R13'" "$work_dir/report.json"

  focused-r16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Creator R16 Media R13 production-pin tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_media_r13_production_pin_r16.py' -v
      - name: Verify production Media readiness
        run: |
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament readiness > /tmp/r16-readiness.json
          python -c "import json; r=json.load(open('/tmp/r16-readiness.json')); assert r['state']=='READY_MEDIA_R13'; assert r['productionMediaReady'] is True; assert r['livePublishingEnabled'] is False"
      - name: Run real Media R13 cross-repo roundtrip
        run: |
          work_dir="$(mktemp -d)"
          PYTHONPATH=src python -m creator_orchestrator.candidate_tournament real-r13 --work-dir "$work_dir" > "$work_dir/report.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['state']=='REAL_MEDIA_R13_COMPATIBILITY_GREEN'; assert r['productionMediaReady'] is True; assert r['acceptedCandidate']['technicalQaPassed'] is True; assert r['acceptedCandidate']['creativeQualityPassed'] is True; assert r['tournamentAcceptance']['realCandidateCount']==1; assert r['tournamentAcceptance']['decisionState']=='insufficient_evidence'; assert r['tournamentAcceptance']['fakeRealRendersCreated']==0; assert r['livePublishingEnabled'] is False" "$work_dir/report.json"

  focused-r17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Creator MVP entrypoint
        run: python -m pip install -e .
      - name: Run Creator R17 MVP tests and real-video E2E
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          creator-mvp --help
          python -m unittest discover -s tests -p 'test_creator_mvp_r17.py' -v

  focused-r18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run Creator R18 semantic director tests
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_semantic_director_r18.py' -v

  focused-r18b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Creator entrypoints
        run: python -m pip install -e .
      - name: Run R18B fake-transport tests only
        env:
          GEMINI_API_KEY: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_gemini_video_provider_r18b.py' -v
      - name: Prove live smoke is blocked without credentials
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          set +e
          creator-gemini-video-smoke --input /tmp/not-present.mp4 > /tmp/gemini-smoke.json
          code=$?
          set -e
          test "$code" -eq 2
          python -c "import json; r=json.load(open('/tmp/gemini-smoke.json')); assert r['state']=='BLOCKED'; assert r['networkAttempted'] is False"

  focused-r19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R19 content-aware real-video E2E
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_content_aware_mvp_r19.py' -v

  focused-r20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R20 canonical semantic export tests
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -p 'test_semantic_export_r20.py' -v

  focused-r21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R21 production-adapter fake transport and sandbox tests
        env:
          GEMINI_API_KEY: ""
          CREATOR_GEMINI_VIDEO_ENABLE: ""
        run: |
          creator-publish-sandbox --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_publish_execution_r21.py' -v

  focused-r22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Creator
        run: python -m pip install -e .
      - name: Run R22 bounded autonomous editor loop tests
        run: |
          creator-editor-loop-r22 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_autonomous_editor_loop_r22.py' -v
      - name: Run source-bound deterministic rehearsal
        run: |
          work_dir="$(mktemp -d)"
          creator-editor-loop-r22 --work-dir "$work_dir" > "$work_dir/stdout.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['terminalState']=='final_bundle'; assert r['terminalRoundIndex']==2; assert r['restartCount']==2; assert r['mediaAcceptedEffects']==8; assert r['mediaSubmitCalls']==8; assert r['criticAcceptedEffects']==8; assert r['criticSubmitCalls']==8; assert r['productionMediaRenderExportReady'] is False; assert r['humanLevelQualityClaimed'] is False" "$work_dir/stdout.json"

  focused-r23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Creator
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run R23 editor-to-publish handoff tests
        run: |
          creator-editor-publish-r23 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_editor_publish_handoff_r23.py' -v

  focused-r24-exact-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact Media R15
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: a17f782da8144d1e890ac83195396a3192df93c2
          path: .r24-media
      - name: Checkout exact Growth R18
        uses: actions/checkout@v4
        with:
          repository: foto6/video3
          ref: 2d3bf275c5b456d53384073fb7ec1ed992e6b996
          path: .r24-growth
      - name: Install runtime prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
          npm --prefix .r24-media install --ignore-scripts
      - name: Generate source fixture
        run: |
          mkdir -p .r24-fixture
          ffmpeg -hide_banner -nostdin -y -f lavfi -i "testsrc2=s=360x640:r=30:d=15.2" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=15.2" -shortest -threads 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k .r24-fixture/source.mp4 >/dev/null 2>&1
      - name: Run R24 unit and exact-pin integration tests
        env:
          R24_MEDIA_CHECKOUT: ${{ github.workspace }}/.r24-media
          R24_GROWTH_CHECKOUT: ${{ github.workspace }}/.r24-growth
          R24_SOURCE_VIDEO: ${{ github.workspace }}/.r24-fixture/source.mp4
        run: |
          creator-closed-loop-r24 --help
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_exact_pin_closed_loop_r24.py' -v
      - name: Run reproducible real-artifact rehearsal
        run: |
          creator-closed-loop-r24 --source .r24-fixture/source.mp4 --brief "Make the proof concise" --media-checkout .r24-media --growth-checkout .r24-growth --out .r24-rehearsal --candidates 2 > .r24-rehearsal.stdout.json
          python -c "import json; r=json.load(open('.r24-rehearsal/closed_loop_rehearsal.v1.json')); assert r['state']=='publish_handoff_ready'; assert r['realMediaRenderEffects'] >= 1; assert r['reeditRounds'] <= 2; assert r['providerInvoked'] is False; assert r['liveProviderMutation'] is False"
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json .r24-rehearsal/final.mp4 > .r24-rehearsal/final.ffprobe.json

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Media R13 producer for R17 E2E
        uses: actions/checkout@v4
        with:
          repository: foto6/video2
          ref: ad4e0ba487a3cabc84dd339d412e19a0db0f9add
          path: .deps/media-r13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and Creator entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e .
      - name: Run full unit test suite
        run: |
          export CREATOR_MEDIA_R13_DIR="$GITHUB_WORKSPACE/.deps/media-r13"
          python -m unittest discover -s tests -v
