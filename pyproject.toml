[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-orchestrator"
version = "0.1.0"
description = "Durable dry-run creator workflow orchestrator"
requires-python = ">=3.11"

[project.scripts]
creator-mvp = "creator_orchestrator.mvp:main"
creator-gemini-video-smoke = "creator_orchestrator.gemini_video_provider:main"
creator-publish-sandbox = "creator_orchestrator.publish_execution:main"

[tool.setuptools.packages.find]
where = ["src"]
