[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-orchestrator"
version = "0.1.0"
description = "Durable dry-run creator workflow orchestrator"
requires-python = ">=3.11"

[project.scripts]
creator-mvp = "creator_orchestrator.mvp:main"
creator-gemini-video-smoke = "creator_orchestrator.gemini_video_provider:main"
creator-publish-sandbox = "creator_orchestrator.publish_execution:main"
creator-editor-loop-r22 = "creator_orchestrator.autonomous_editor_loop:main"
creator-editor-publish-r23 = "creator_orchestrator.editor_publish_handoff:main"
creator-closed-loop-r24 = "creator_orchestrator.exact_pin_closed_loop:main"
creator-real-review-r26 = "creator_orchestrator.real_review_closed_loop:main"
creator-live-review-r27 = "creator_orchestrator.live_review_execution:main"
creator-dynamic-live-review-r28 = "creator_orchestrator.dynamic_live_review_loop:main"
creator-exact-dynamic-r29 = "creator_orchestrator.exact_dynamic_e2e_r29:main"
creator-coordinator-r30 = "creator_orchestrator.coordinator_continuation_r30:main"
creator-live-session-r31 = "creator_orchestrator.live_session_authority_r31:main"
creator-autonomous-tournament-r32 = "creator_orchestrator.autonomous_tournament_r32:main"
creator-publish-transaction-r33 = "creator_orchestrator.publish_transaction_r33:main"
creator-multiplatform-publish-r34 = "creator_orchestrator.multiplatform_publish_saga_r34:main"
creator-release-escrow-r35 = "creator_orchestrator.release_escrow_canary_r35:main"

[tool.setuptools.packages.find]
where = ["src"]
