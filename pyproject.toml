[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-orchestrator"
version = "0.1.0"
description = "Durable dry-run creator workflow orchestrator"
requires-python = ">=3.11"

[project.scripts]
creator-mvp = "creator_orchestrator.mvp:main"
creator-gemini-video-smoke = "creator_orchestrator.gemini_video_provider:main"
creator-publish-sandbox = "creator_orchestrator.publish_execution:main"
creator-editor-loop-r22 = "creator_orchestrator.autonomous_editor_loop:main"
creator-editor-publish-r23 = "creator_orchestrator.editor_publish_handoff:main"
creator-closed-loop-r24 = "creator_orchestrator.exact_pin_closed_loop:main"
creator-real-review-r26 = "creator_orchestrator.real_review_closed_loop:main"
creator-live-review-r27 = "creator_orchestrator.live_review_execution:main"
creator-dynamic-live-review-r28 = "creator_orchestrator.dynamic_live_review_loop:main"

[tool.setuptools.packages.find]
where = ["src"]
